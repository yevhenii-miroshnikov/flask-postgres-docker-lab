services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: labdb
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: "${LAB_DB_PASSWORD:?Set LAB_DB_PASSWORD in .env}"
    volumes:
      - compose_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: "postgresql://labuser:${LAB_DB_PASSWORD:?Set LAB_DB_PASSWORD in .env}@db:5432/labdb"
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  compose_pgdata:
    name: devops-lab1-compose-pgdata
