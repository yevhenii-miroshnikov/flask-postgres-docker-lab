name: devops-lab1

services:
  db:
    image: postgres:17.11
    env_file:
      - config/db.env.example
    volumes:
      - compose_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - config/api.env.example
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  compose_pgdata:
    name: devops-lab1-compose-pgdata
